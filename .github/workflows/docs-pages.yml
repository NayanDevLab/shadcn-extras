name: Docs to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm install

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build registry (optional)
        run: npm run build:registry
        continue-on-error: true

      # 🧱 Build static docs -> out/
      - name: Build static docs
        run: npm run docs:build

      # 🌈 Build Storybook -> storybook-static/
      - name: Build Storybook
        run: npm run build-storybook

      # 📦 Copy Storybook under /storybook in the exported site
      - name: Bundle Storybook into site
        run: |
          mkdir -p out/storybook
          cp -r storybook-static/* out/storybook/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
